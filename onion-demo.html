<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洋葱学园 · 素材智能生产平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #4F6EF7; --primary-light: #EEF2FF;
            --success: #22C55E; --warning: #F59E0B; --danger: #EF4444;
            --text-primary: #1F2937; --text-secondary: #6B7280; --text-tertiary: #9CA3AF;
            --bg-page: #F5F7FA; --border: #E5E7EB; --border-light: #F3F4F6;
            --shadow: 0 1px 3px rgba(0,0,0,0.06); --radius: 8px; --radius-lg: 12px;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: var(--bg-page); color: var(--text-primary); font-size: 14px; line-height: 1.6; }

        .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .login-box { width: 400px; background: white; border-radius: 16px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .login-logo { text-align: center; margin-bottom: 32px; }
        .logo-icon { font-size: 48px; margin-bottom: 8px; }
        .login-logo h1 { font-size: 22px; margin-bottom: 4px; }
        .login-logo p { color: var(--text-secondary); font-size: 14px; }
        .form-item { margin-bottom: 20px; }
        .form-item label { display: block; margin-bottom: 6px; font-weight: 500; }
        .form-item input, .form-item select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn-primary:hover { background: #3B5BDB; }
        .btn-block { width: 100%; padding: 12px; font-size: 15px; }
        .login-tip { text-align: center; margin-top: 20px; color: var(--text-tertiary); font-size: 12px; }

        .main-app { min-height: 100vh; display: flex; flex-direction: column; }
        .header { height: 56px; background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; gap: 32px; position: sticky; top: 0; z-index: 100; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .logo-mini { font-size: 24px; }
        .platform-name { font-size: 16px; font-weight: 600; }
        .env-tag { font-size: 11px; background: #FEF3C7; color: #92400E; padding: 2px 8px; border-radius: 4px; }
        .header-nav { display: flex; gap: 4px; flex: 1; }
        .nav-item { padding: 6px 16px; border-radius: var(--radius); color: var(--text-secondary); cursor: pointer; font-size: 14px; }
        .nav-item:hover { background: var(--bg-page); color: var(--text-primary); }
        .nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 500; }
        .header-right { display: flex; align-items: center; gap: 16px; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-role { font-size: 12px; color: var(--primary); background: var(--primary-light); padding: 2px 10px; border-radius: 10px; }
        .avatar { width: 32px; height: 32px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; }
        .main-content { flex: 1; padding: 24px; max-width: 1440px; width: 100%; margin: 0 auto; }

        .card { background: white; border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .stat-card { background: white; border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); }
        .stat-label { color: var(--text-secondary); font-size: 13px; }
        .stat-value { font-size: 28px; font-weight: 700; }
        .stat-trend { font-size: 12px; }
        .stat-trend.up { color: var(--success); }
        .tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .tag-blue { background: var(--primary-light); color: var(--primary); }
        .tag-green { background: #F0FDF4; color: var(--success); }
        .tag-orange { background: #FFF7ED; color: var(--warning); }
        .tag-gray { background: #F3F4F6; color: var(--text-secondary); }
        .btn-secondary { background: white; color: var(--text-primary); border: 1px solid var(--border); padding: 9px 18px; border-radius: var(--radius); font-size: 14px; cursor: pointer; }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .btn-sm { padding: 5px 12px; font-size: 12px; }

        .production-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; min-height: 600px; }
        .production-sidebar { background: white; border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); }
        .step-list { display: flex; flex-direction: column; gap: 8px; }
        .step-item { padding: 14px 16px; border-radius: var(--radius); cursor: pointer; display: flex; align-items: center; gap: 12px; border: 1px solid transparent; }
        .step-item:hover { background: var(--bg-page); }
        .step-item.active { background: var(--primary-light); border-color: var(--primary); }
        .step-item.done .step-num { background: var(--success); color: white; }
        .step-num { width: 28px; height: 28px; border-radius: 50%; background: var(--border-light); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
        .step-item.active .step-num { background: var(--primary); color: white; }
        .step-name { font-weight: 500; font-size: 14px; }
        .step-desc { font-size: 12px; color: var(--text-tertiary); }
        .production-main { background: white; border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow); }
        .form-group { margin-bottom: 20px; }
        .form-label { font-weight: 500; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .form-label .required { color: var(--danger); }
        .form-input, .form-select, .form-textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; }
        .form-textarea { min-height: 80px; resize: vertical; }
        .channel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .channel-card { border: 2px solid var(--border); border-radius: var(--radius); padding: 14px; cursor: pointer; text-align: center; }
        .channel-card:hover { border-color: var(--primary-light); }
        .channel-card.selected { border-color: var(--primary); background: var(--primary-light); }
        .channel-icon { font-size: 28px; margin-bottom: 6px; }
        .channel-name { font-weight: 500; font-size: 13px; }
        .channel-spec { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
        .style-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .style-tag { padding: 6px 14px; background: var(--bg-page); border: 1px solid var(--border); border-radius: 16px; font-size: 13px; cursor: pointer; }
        .style-tag:hover { border-color: var(--primary); }
        .style-tag.selected { background: var(--primary); color: white; border-color: var(--primary); }
        .style-tag.random { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; }
        .generate-bar { display: flex; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-light); }
        .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 20px; }
        .result-card { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); position: relative; aspect-ratio: 3/4; background: #F3F4F6; }
        .result-cover { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 48px; }
        .result-actions { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px; background: linear-gradient(transparent, rgba(0,0,0,0.7)); display: flex; gap: 8px; opacity: 0; transition: opacity 0.2s; }
        .result-card:hover .result-actions { opacity: 1; }
        .result-btn { flex: 1; padding: 6px; background: rgba(255,255,255,0.9); border: none; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .generating { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--primary); padding: 40px; }
        .spinner { width: 20px; height: 20px; border: 2px solid var(--primary-light); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .material-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .material-card { background: white; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); cursor: pointer; }
        .material-card:hover { transform: translateY(-2px); }
        .material-cover { height: 160px; background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%); display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .material-info { padding: 14px; }
        .material-title { font-weight: 500; margin-bottom: 6px; font-size: 14px; }
        .material-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        .material-stats { display: flex; gap: 16px; color: var(--text-tertiary); font-size: 12px; }
        .filter-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-item { padding: 8px 16px; background: white; border: 1px solid var(--border); border-radius: 20px; font-size: 13px; cursor: pointer; }
        .filter-item:hover, .filter-item.active { background: var(--primary); color: white; border-color: var(--primary); }

        .report-list { display: flex; flex-direction: column; gap: 12px; }
        .report-item { background: white; border-radius: var(--radius); padding: 16px 20px; display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow); cursor: pointer; }
        .report-icon { width: 44px; height: 44px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .report-icon.blue { background: var(--primary-light); }
        .report-icon.green { background: #F0FDF4; }
        .report-icon.orange { background: #FFF7ED; }
        .report-body { flex: 1; }
        .report-name { font-weight: 500; margin-bottom: 2px; }
        .report-desc { color: var(--text-secondary); font-size: 13px; }
        .report-side { text-align: right; }
        .report-time { color: var(--text-tertiary); font-size: 12px; margin-bottom: 4px; }

        .asset-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .asset-tab { padding: 10px 20px; cursor: pointer; color: var(--text-secondary); border-bottom: 2px solid transparent; margin-bottom: -1px; }
        .asset-tab:hover { color: var(--text-primary); }
        .asset-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }
        .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
        .asset-card { background: white; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); cursor: pointer; }
        .asset-card:hover { transform: translateY(-2px); }
        .asset-thumb { height: 120px; background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%); display: flex; align-items: center; justify-content: center; font-size: 32px; }
        .asset-info { padding: 12px; }
        .asset-name { font-weight: 500; font-size: 13px; margin-bottom: 4px; }
        .asset-tags { display: flex; gap: 4px; flex-wrap: wrap; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal { background: white; border-radius: var(--radius-lg); width: 90%; max-width: 720px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: white; z-index: 10; }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close { width: 32px; height: 32px; border: none; background: var(--bg-page); border-radius: 50%; cursor: pointer; font-size: 16px; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; }
        .modal-body { padding: 24px; }
        .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border-light); display: flex; justify-content: flex-end; gap: 12px; }
        .material-detail-cover { height: 240px; background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 64px; margin-bottom: 20px; }
        .detail-row { display: flex; margin-bottom: 14px; }
        .detail-label { width: 100px; color: var(--text-secondary); flex-shrink: 0; }
        .detail-value { flex: 1; }
        .insight-card { background: white; border-left: 3px solid var(--primary); padding: 12px 16px; border-radius: 0 var(--radius) var(--radius) 0; margin-bottom: 10px; box-shadow: var(--shadow); }
        .insight-title { font-weight: 500; margin-bottom: 4px; }
        .insight-desc { color: var(--text-secondary); font-size: 13px; }
        .report-section { margin-bottom: 24px; }
        .report-section h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
        .report-content { background: #F9FAFB; border-radius: var(--radius); padding: 16px; font-size: 13px; color: var(--text-secondary); line-height: 1.8; white-space: pre-wrap; }

        @media (max-width: 1024px) { .grid-3 { grid-template-columns: repeat(2, 1fr); } .production-layout { grid-template-columns: 1fr; } .channel-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .header-nav { display: none; } .grid-2, .grid-3 { grid-template-columns: 1fr; } .result-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>

                        <div class="filter-item">已通过</div>

                    <button class="btn-primary" onclick="alert('演示：AI 生成新一期报告')">✨ 生成新报告</button>
                </div>
                <div class="report-list">
                    ${STRATEGY_REPORTS.map(r => `
                        <div class="report-item" onclick="showReportDetail(${r.id})">
                            <div class="report-icon ${typeColors[r.type]}">${typeIcons[r.type]}</div>
                            <div class="report-body">
                                <div class="report-name">${r.name}</div>
                                <div class="report-desc">${r.desc} · ${r.period}</div>
                            </div>
                            <div class="report-side">
                                <div class="report-time">${r.createTime}</div>
                                <span class="tag ${statusTags[r.status]}">${statusNames[r.status]}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function showReportDetail(id) {
            const report = STRATEGY_REPORTS.find(r => r.id === id);
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            let contentHtml = '';
            if (report.type === 'demand') {
                contentHtml = `<div class="report-section"><h3>🎯 购买动因</h3><div class="report-content">${report.content.purchaseDrivers}</div></div>
                    <div class="report-section"><h3>🏠 信息屋</h3><div class="report-content">${report.content.infoHouse}</div></div>
                    <div class="report-section"><h3>📊 数据洞察</h3><div class="report-content">${report.content.insights}</div></div>`;
            } else if (report.type === 'creative') {
                contentHtml = `<div class="report-section"><h3>🌐 外部创意趋势</h3><div class="report-content">${report.content.externalTrends}</div></div>
                    <div class="report-section"><h3>📈 内部素材表现</h3><div class="report-content">${report.content.internalAnalysis}</div></div>
                    <div class="report-section"><h3>💡 本期建议</h3><div class="report-content">${report.content.recommendations}</div></div>`;
            } else {
                contentHtml = `<div class="report-section"><h3>📍 功能定位</h3><div class="report-content">${report.content.positioning}</div></div>
                    <div class="report-section"><h3>🎬 目标场景</h3><div class="report-content">${report.content.targetScenes}</div></div>
                    <div class="report-section"><h3>🎨 创意方向</h3><div class="report-content">${report.content.creativeDirections}</div></div>`;
            }

            modal.innerHTML = `
                <div class="modal">
                    <div class="modal-header">
                        <div>
                            <div class="modal-title">${report.name}</div>
                            <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">${report.desc} · ${report.period}</div>
                        </div>
                        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
                    </div>
                    <div class="modal-body">${contentHtml}</div>
                    <div class="modal-footer">
                        <button class="btn-secondary" onclick="this.closest('.modal-overlay').remove()">关闭</button>
                        ${report.status === 'pending' ? '<button class="btn-primary" onclick="alert(\'演示：审核通过\')">✓ 审核通过</button>' : ''}
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // 生产中心
        function renderProduction() {
            const content = document.getElementById('main-content');
            const steps = [
                { num: 1, name: '选择渠道', desc: '确定投放平台与规格' },
                { num: 2, name: '配置策略', desc: '人群、场景、风格' },
                { num: 3, name: '文案生成', desc: 'AI 生成主副标题' },
                { num: 4, name: '生成素材', desc: '批量产出图片/视频' },
                { num: 5, name: '审核投放', desc: '业务审核后交付' }
            ];

            content.innerHTML = `
                <div style="margin-bottom:24px;">
                    <div style="font-size:22px;font-weight:600;margin-bottom:4px;">生产中心</div>
                    <div style="color:var(--text-secondary);font-size:14px;">选择策略 → 配置规则 → AI 批量生成 → 审核交付</div>
                </div>
                <div class="production-layout">
                    <div class="production-sidebar">
                        <div class="card-title" style="margin-bottom:12px;">生产流程</div>
                        <div class="step-list">
                            ${steps.map(s => `
                                <div class="step-item ${productionStep === s.num ? 'active' : ''} ${productionStep > s.num ? 'done' : ''}" onclick="productionStep=${s.num};renderProduction()">
                                    <div class="step-num">${productionStep > s.num ? '✓' : s.num}</div>
                                    <div>
                                        <div class="step-name">${s.name}</div>
                                        <div class="step-desc">${s.desc}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border-light);font-size:13px;">
                            <div style="color:var(--text-tertiary);margin-bottom:8px;font-size:12px;">当前配置</div>
                            <div>渠道：${productionConfig.channel ? PRODUCTION_CONFIG.channels.find(c=>c.id===productionConfig.channel)?.name : '<span style="color:var(--text-tertiary)">未选择</span>'}</div>
                            <div>风格：${productionConfig.style.length > 0 ? productionConfig.style.join('、') : '<span style="color:var(--text-tertiary)">未选择</span>'}</div>
                            <div>数量：${productionConfig.quantity} 张</div>
                        </div>
                    </div>
                    <div class="production-main">${getStepContent()}</div>
                </div>
            `;
        }

        function getStepContent() {
            switch(productionStep) {
                case 1: return renderStepChannel();
                case 2: return renderStepConfig();
                case 3: return renderStepCopy();
                case 4: return renderStepGenerate();
                case 5: return renderStepAudit();
                default: return '';
            }
        }

        function renderStepChannel() {
            return `
                <div class="card-title">选择投放渠道</div>
                <p style="color:var(--text-secondary);margin-bottom:20px;font-size:13px;">不同渠道有各自的尺寸规范与审核规则，系统将自动适配</p>
                <div class="channel-grid">
                    ${PRODUCTION_CONFIG.channels.map(ch => `
                        <div class="channel-card ${productionConfig.channel === ch.id ? 'selected' : ''}" onclick="productionConfig.channel='${ch.id}';renderProduction()">
                            <div class="channel-icon">${ch.icon}</div>
                            <div class="channel-name">${ch.name}</div>
                            <div class="channel-spec">${ch.spec}</div>
                        </div>
                    `).join('')}
                </div>
                ${productionConfig.channel ? `
                    <div style="margin-top:20px;padding:16px;background:#F9FAFB;border-radius:8px;">
                        <div style="font-weight:500;margin-bottom:10px;font-size:14px;">📋 渠道规则（自动加载）</div>
                        ${PRODUCTION_CONFIG.channels.find(c=>c.id===productionConfig.channel).rules.map(r => `
                            <div style="display:flex;align-items:center;gap:8px;padding:6px 0;color:var(--text-secondary);font-size:13px;">
                                <span style="color:var(--warning);">⚠️</span> ${r}
                            </div>
                        `).join('')}
                    </div>
                ` : ''}
                <div class="generate-bar">
                    <button class="btn-primary" style="margin-left:auto;" onclick="productionStep=2;renderProduction()" ${!productionConfig.channel ? 'disabled style="opacity:0.5"' : ''}>下一步：配置策略 →</button>
                </div>
            `;
        }

        function renderStepConfig() {
            return `
                <div class="card-title">配置生成策略</div>
                <div class="form-group">
                    <div class="form-label">目标人群 <span class="required">*</span></div>
                    <div class="style-tags">
                        ${PRODUCTION_CONFIG.audiences.map(a => `<div class="style-tag ${productionConfig.audience === a ? 'selected' : ''}" onclick="productionConfig.audience='${a}';renderProduction()">${a}</div>`).join('')}
                    </div>
                </div>
                <div class="form-group">
                    <div class="form-label">使用场景 <span class="required">*</span></div>
                    <div class="style-tags">
                        ${PRODUCTION_CONFIG.scenarios.map(s => `<div class="style-tag ${productionConfig.scenario === s ? 'selected' : ''}" onclick="productionConfig.scenario='${s}';renderProduction()">${s}</div>`).join('')}
                    </div>
                </div>
                <div class="form-group">
                    <div class="form-label">视觉风格 <span class="required">*</span></div>
                    <div class="style-tags">
                        <div class="style-tag random ${productionConfig.style.includes('random') ? 'selected' : ''}" onclick="productionConfig.style=['random'];renderProduction()">🎲 随机组合</div>
                        ${PRODUCTION_CONFIG.styles.map(s => `<div class="style-tag ${productionConfig.style.includes(s) ? 'selected' : ''}" onclick="toggleStyle('${s}')">${s}</div>`).join('')}
                    </div>
                </div>
                <div class="form-group">
                    <div class="form-label">生成数量</div>
                    <select class="form-select" style="width:200px;" onchange="productionConfig.quantity=parseInt(this.value)">
                        <option value="4">4 张</option>
                        <option value="6" selected>6 张</option>
                        <option value="10">10 张</option>
                        <option value="20">20 张</option>
                    </select>
                </div>
                <div class="generate-bar">
                    <button class="btn-secondary" onclick="productionStep=1;renderProduction()">← 上一步</button>
                    <button class="btn-primary" style="margin-left:auto;" onclick="productionStep=3;renderProduction()" ${!productionConfig.audience || !productionConfig.scenario || productionConfig.style.length === 0 ? 'disabled style="opacity:0.5"' : ''}>下一步：生成文案 →</button>
                </div>
            `;
        }

        function toggleStyle(s) {
            const idx = productionConfig.style.indexOf(s);
            if (idx > -1) productionConfig.style.splice(idx, 1);
            else productionConfig.style.push(s);
            renderProduction();
        }

        function renderStepCopy() {
            const tpl = PRODUCTION_CONFIG.copyTemplates.find(t => t.id === productionConfig.copyTemplate);
            let preview = tpl.template.replace('{痛点}', '数学成绩下滑').replace('{情绪}', '焦虑').replace('{产品}', '洋葱学园').replace('{场景}', '期末冲刺').replace('{价值}', '1节直播课+全套资料').replace('{人群}', '初三家长').replace('{天数}', '3').replace('{行动}', '报名').replace('{金额}', '20');

            return `
                <div class="card-title">AI 文案生成</div>
                <p style="color:var(--text-secondary);margin-bottom:20px;font-size:13px;">基于已确认的策略报告（第14期），AI 自动生成符合业务逻辑的文案</p>
                <div class="form-group">
                    <div class="form-label">文案策略模板</div>
                    <div style="display:flex;flex-direction:column;gap:10px;">
                        ${PRODUCTION_CONFIG.copyTemplates.map(t => `
                            <label style="display:flex;align-items:center;gap:10px;padding:12px;border:1px solid ${productionConfig.copyTemplate===t.id?'var(--primary)':'var(--border)'};border-radius:8px;cursor:pointer;background:${productionConfig.copyTemplate===t.id?'var(--primary-light)':'white'};">
                                <input type="radio" name="copyTpl" ${productionConfig.copyTemplate===t.id?'checked':''} onchange="productionConfig.copyTemplate=${t.id};renderProduction()">
                                <div>
                                    <div style="font-weight:500;">${t.name}</div>
                                    <div style="font-size:12px;color:var(--text-secondary);">${t.template}</div>
                                </div>
                            </label>
                        `).join('')}
                    </div>
                </div>
                <div class="form-group">
                    <div class="form-label">生成文案预览（可编辑）</div>
                    <textarea class="form-textarea" id="copy-text" rows="3">${productionConfig.copyText || preview}</textarea>
                </div>
                <div class="generate-bar">
                    <button class="btn-secondary" onclick="productionStep=2;renderProduction()">← 上一步</button>
                    <button class="btn-primary" style="margin-left:auto;" onclick="productionConfig.copyText=document.getElementById('copy-text').value;productionStep=4;renderProduction()">下一步：生成素材 →</button>
                </div>
            `;
        }

        function renderStepGenerate() {
            return `
                <div class="card-title">生成素材</div>
                <p style="color:var(--text-secondary);margin-bottom:20px;font-size:13px;">确认配置后，AI 将批量生成 ${productionConfig.quantity} 张素材</p>
                <div style="background:#F9FAFB;border-radius:8px;padding:16px;margin-bottom:20px;font-size:13px;">
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                        <div><span style="color:var(--text-tertiary);">渠道：</span>${PRODUCTION_CONFIG.channels.find(c=>c.id===productionConfig.channel)?.name}</div>
                        <div><span style="color:var(--text-tertiary);">人群：</span>${productionConfig.audience}</div>
                        <div><span style="color:var(--text-tertiary);">场景：</span>${productionConfig.scenario}</div>
                        <div><span style="color:var(--text-tertiary);">风格：</span>${productionConfig.style.join('、')}</div>
                        <div><span style="color:var(--text-tertiary);">数量：</span>${productionConfig.quantity} 张</div>
                        <div><span style="color:var(--text-tertiary);">文案：</span>${productionConfig.copyText.substring(0, 30)}...</div>
                    </div>
                </div>
                <div id="generate-status">
                    <button class="btn-primary btn-block" style="padding:14px;font-size:15px;" onclick="startGenerate()">🚀 开始生成（${productionConfig.quantity} 张）</button>
                </div>
                <div id="generate-results" style="display:none;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                        <div style="font-weight:500;">生成结果</div>
                        <div style="display:flex;gap:8px;">
                            <button class="btn-secondary btn-sm" onclick="document.querySelectorAll('.result-check').forEach(cb=>cb.checked=true)">全选</button>
                            <button class="btn-secondary btn-sm" onclick="alert('演示：下载选中')">⬇ 下载</button>
                        </div>
                    </div>
                    <div class="result-grid" id="results-grid"></div>
                </div>
                <div class="generate-bar">
                    <button class="btn-secondary" onclick="productionStep=3;renderProduction()">← 上一步</button>
                    <button class="btn-primary" style="margin-left:auto;display:none;" id="next-to-audit" onclick="productionStep=5;renderProduction()">下一步：审核投放 →</button>
                </div>
            `;
        }

        function startGenerate() {
            const statusDiv = document.getElementById('generate-status');
            const resultsDiv = document.getElementById('generate-results');
            const grid = document.getElementById('results-grid');
            const nextBtn = document.getElementById('next-to-audit');

            statusDiv.innerHTML = '<div class="generating"><div class="spinner"></div><span>AI 生成中... 正在调用生图引擎</span></div>';

            setTimeout(() => {
                statusDiv.style.display = 'none';
                resultsDiv.style.display = 'block';
                nextBtn.style.display = 'block';

                const shuffled = [...GENERATED_RESULTS].sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, Math.min(productionConfig.quantity, 6));

                grid.innerHTML = selected.map(r => `
                    <div class="result-card">
                        <div class="result-cover">${r.emoji}</div>
                        <div style="position:absolute;top:8px;left:8px;">
                            <span class="tag tag-blue" style="font-size:10px;">${r.style}</span>
                        </div>
                        <div style="position:absolute;top:8px;right:8px;">
                            <input type="checkbox" class="result-check" checked>
                        </div>
                        <div class="result-actions">
                            <button class="result-btn" onclick="alert('编辑')">编辑</button>
                            <button class="result-btn" onclick="alert('下载')">下载</button>
                            <button class="result-btn" onclick="alert('删除')">删除</button>
                        </div>
                    </div>
                `).join('');
            }, 2000);
        }

        function renderStepAudit() {
            return `
                <div class="card-title">审核与交付</div>
                <p style="color:var(--text-secondary);margin-bottom:20px;font-size:13px;">素材需经业务团队审核通过后，方可交付投放</p>
                <div class="card" style="background:#F9FAFB;">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <div>
                            <div style="font-weight:500;margin-bottom:4px;">📤 提交审核</div>
                            <div style="font-size:13px;color:var(--text-secondary);">将生成素材提交至投放团队负责人审核</div>
                        </div>
                        <button class="btn-primary" onclick="alert('演示：已提交审核')">提交审核</button>
                    </div>
                </div>
                <div class="card" style="background:#F0FDF4;border:1px solid #BBF7D0;">
                    <div style="display:flex;align-items:center;gap:12px;">
                        <span style="font-size:24px;">✅</span>
                        <div>
                            <div style="font-weight:500;color:#166534;">上一批次已完成交付</div>
                            <div style="font-size:13px;color:#15803D;">2026-10-10 批次 · 6 张素材已通过审核并同步至投放平台</div>
                        </div>
                    </div>
                </div>
                <div class="generate-bar">
                    <button class="btn-secondary" onclick="productionStep=4;renderProduction()">← 上一步</button>
                    <button class="btn-primary" style="margin-left:auto;" onclick="productionStep=1;productionConfig={channel:'',style:[],scenario:'',audience:'',copyTemplate:1,copyText:'',quantity:6};renderProduction()">🔄 开始新的生产任务</button>
                </div>
            `;
        }

        // 资产中心
        function renderAssets() {
            const content = document.getElementById('main-content');
            const tabs = [
                { id: 'video', name: '🎬 视频素材' },
                { id: 'image', name: '🖼️ 图片素材' },
                { id: 'brand', name: '🧅 品牌资产' },
                { id: 'template', name: '📐 渠道模板' }
            ];
            const items = ASSET_DATA[assetTab] || [];

            content.innerHTML = `
                <div style="margin-bottom:24px;">
                    <div style="font-size:22px;font-weight:600;margin-bottom:4px;">资产中心</div>
                    <div style="color:var(--text-secondary);font-size:14px;">统一管理视频 / 图片 / 品牌资产 / 渠道模板，供生产流程调用</div>
                </div>
                <div class="asset-tabs">
                    ${tabs.map(t => `<div class="asset-tab ${assetTab === t.id ? 'active' : ''}" onclick="assetTab='${t.id}';renderAssets()">${t.name}</div>`).join('')}
                </div>
                <div class="asset-grid">
                    ${items.map(item => {
                        let meta = '';
                        if (assetTab === 'video') meta = `<div class="asset-tags">${item.tags.map(t=>`<span class="tag tag-gray" style="font-size:11px;">${t}</span>`).join('')}</div><div style="font-size:12px;color:var(--text-tertiary);margin-top:6px;">${item.type} · ${item.duration}</div>`;
                        else if (assetTab === 'image') meta = `<div class="asset-tags">${item.tags.map(t=>`<span class="tag tag-gray" style="font-size:11px;">${t}</span>`).join('')}</div><div style="font-size:12px;color:var(--text-tertiary);margin-top:6px;">风格：${item.style}</div>`;
                        else if (assetTab === 'brand') meta = `<div class="asset-tags"><span class="tag tag-blue" style="font-size:11px;">${item.type}</span></div><div style="font-size:12px;color:var(--text-tertiary);margin-top:6px;">格式：${item.format}</div>`;
                        else meta = `<div class="asset-tags"><span class="tag tag-orange" style="font-size:11px;">${item.channel}</span></div><div style="font-size:12px;color:var(--text-tertiary);margin-top:6px;">已使用 ${item.usage} 次</div>`;
                        return `
                            <div class="asset-card" onclick="alert('演示：查看资产详情 - ${item.name}')">
                                <div class="asset-thumb">${assetTab === 'video' ? '🎬' : assetTab === 'image' ? '🖼️' : assetTab === 'brand' ? '🧅' : '📐'}</div>
                                <div class="asset-info">
                                    <div class="asset-name">${item.name}</div>
                                    ${meta}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }
    </script>
</body>
</html>
